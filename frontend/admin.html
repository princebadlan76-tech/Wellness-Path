<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Admin Dashboard - Wellness Path</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Quill Rich Text Editor CDN -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        .auth-container, .admin-box {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 800px;
            margin: 0 auto 2rem auto;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #f9fafb;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-card h3 { margin: 0; font-size: 1.8rem; color: var(--primary); }
        .stat-card p { margin: 0.5rem 0 0 0; color: #6b7280; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--primary-dark); }
        .hidden { display: none; }
        .logout-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #f3f4f6;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .admin-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #6b7280;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .article-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .action-btns { display: flex; gap: 0.5rem; }
        .btn-edit { background: #f59e0b; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
        .cancel-edit { background: #6b7280; margin-top: 0.5rem; }
        #editor { height: 250px; margin-bottom: 1rem; background: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Wellness<span>Path</span> (Admin)</a>
            <nav><a href="index.html" target="_blank">View Site</a></nav>
        </div>
    </header>

    <main class="container">
        <section class="hero" style="padding: 2rem 0;">
            <h1>WordPress-Style Admin Dashboard</h1>
            <p>Manage content with visual rich-text editor and SEO tools.</p>
        </section>

        <!-- LOGIN SECTION -->
        <div id="authSection" class="auth-container">
            <h2>Admin Login</h2>
            <form id="loginForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="Enter admin email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Login</button>
                <p id="authMessage" style="color:red; text-align:center; margin-top:1rem;"></p>
            </form>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="adminSection" class="hidden">
            <div class="logout-bar">
                <span>Logged in as Admin</span>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><h3 id="statTotalPosts">0</h3><p>Total Articles</p></div>
                <div class="stat-card"><h3 id="statCategories">3</h3><p>Categories</p></div>
                <div class="stat-card"><h3 id="statPublished">0</h3><p>Published Live</p></div>
            </div>

            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('editorTab', this)">Article & SEO Editor</button>
                <button class="tab-btn" onclick="switchTab('manageTab', this)">Manage Articles</button>
            </div>

            <!-- EDITOR TAB -->
            <div id="editorTab" class="admin-box">
                <h3 id="formTitle" style="margin-bottom: 1.5rem;">Create New Article</h3>
                <form id="articleForm">
                    <input type="hidden" id="editingId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Article Title</label>
                            <input type="text" id="title" required placeholder="e.g., Guide to Yoga">
                        </div>
                        <div class="form-group">
                            <label>URL Slug (SEO)</label>
                            <input type="text" id="slug" placeholder="e.g., guide-to-yoga">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="category" required>
                                <option value="fitness">Fitness & Workouts</option>
                                <option value="nutrition">Nutrition & Diet</option>
                                <option value="recovery">Recovery & Sleep</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="status" required>
                                <option value="published">Published</option>
                                <option value="draft">Draft</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Featured Image URL</label>
                        <input type="url" id="image_url" placeholder="https://images.unsplash.com/photo-...">
                    </div>

                    <div class="form-group">
                        <label>Short Description / Excerpt</label>
                        <textarea id="excerpt" rows="2" required placeholder="Brief summary for homepage..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Full Article Content (Visual Rich Text Editor)</label>
                        <div id="editor"></div>
                    </div>

                    <h4 style="margin: 1.5rem 0 1rem 0; border-top: 1px solid var(--border); padding-top: 1rem;">SEO Settings</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Meta Title</label>
                            <input type="text" id="meta_title" placeholder="SEO title for search engines">
                        </div>
                        <div class="form-group">
                            <label>Meta Description</label>
                            <input type="text" id="meta_description" placeholder="SEO description under 160 characters">
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Publish Article</button>
                    <button type="button" id="cancelEditBtn" class="btn-submit cancel-edit hidden">Cancel Edit</button>
                    <p id="statusMessage" style="text-align:center; margin-top:1rem; font-weight:500;"></p>
                </form>
            </div>

            <!-- MANAGE TAB -->
            <div id="manageTab" class="admin-box hidden">
                <h3>All Articles</h3>
                <div id="manageArticlesList" style="margin-top: 1rem;"><p style="text-align: center; color: #6b7280;">Loading...</p></div>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://cgpwkxvpterwjjmvycmd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNncHdreHZwdGVyd2pqbXZ5Y21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDY5NjUsImV4cCI6MjEwNzIyMjk2NX0.oDA47jyZfpzvY3IpFAmKyyiSEkkL5m7fUDb4ouPCorc';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Quill Rich Text Editor Initialization
        const quill = new Quill('#editor', {
            theme: 'snow',
            placeholder: 'Type your full article content here... (Use bold, headings, bullet points, etc.)',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'blockquote', 'code-block'],
                    ['clean']
                ]
            }
        });

        const authSection = document.getElementById('authSection');
        const adminSection = document.getElementById('adminSection');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const authMessage = document.getElementById('authMessage');
        const logoutBtn = document.getElementById('logoutBtn');

        const articleForm = document.getElementById('articleForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const statusMessage = document.getElementById('statusMessage');
        const formTitle = document.getElementById('formTitle');
        const editingIdInput = document.getElementById('editingId');
        const manageArticlesList = document.getElementById('manageArticlesList');

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                authSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadDashboardData();
            } else {
                authSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        }
        checkUser();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = 'Logging in...';

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                authMessage.innerText = 'Login Failed: ' + error.message;
                loginBtn.disabled = false;
                loginBtn.innerText = 'Login';
            } else {
                checkUser();
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            checkUser();
        });

        window.switchTab = function(tabId, btn) {
            document.querySelectorAll('.admin-box').forEach(box => {
                if(box.id === 'editorTab' || box.id === 'manageTab') box.classList.add('hidden');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        async function loadDashboardData() {
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return;

            document.getElementById('statTotalPosts').innerText = data.length;
            document.getElementById('statPublished').innerText = data.filter(p => p.status === 'published' || !p.status).length;

            if (data.length === 0) {
                manageArticlesList.innerHTML = `<p style="text-align: center; color: #6b7280;">No articles found.</p>`;
                return;
            }

            manageArticlesList.innerHTML = "";
            data.forEach(post => {
                const item = document.createElement('div');
                item.className = 'article-list-item';
                item.innerHTML = `
                    <div>
                        <h4 style="margin:0 0 0.25rem 0;">${post.title}</h4>
                        <span style="font-size:0.85rem; background:#f3f4f6; padding:0.2rem 0.5rem; border-radius:4px;">${post.category || 'General'}</span>
                        <span style="font-size:0.85rem; color:${post.status === 'draft' ? '#f59e0b' : 'green'}; margin-left:0.5rem;">● ${post.status || 'published'}</span>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick='editPost(${JSON.stringify(post)})'>Edit</button>
                        <button class="btn-delete" onclick="deletePost('${post.id}')">Delete</button>
                    </div>
                `;
                manageArticlesList.appendChild(item);
            });
        }

        window.editPost = function(post) {
            editingIdInput.value = post.id;
            document.getElementById('title').value = post.title || '';
            document.getElementById('slug').value = post.slug || '';
            document.getElementById('category').value = post.category ? post.category.toLowerCase() : 'fitness';
            document.getElementById('status').value = post.status || 'published';
            document.getElementById('image_url').value = post.image_url || '';
            document.getElementById('excerpt').value = post.excerpt || '';
            quill.root.innerHTML = post.content || '';
            document.getElementById('meta_title').value = post.meta_title || '';
            document.getElementById('meta_description').value = post.meta_description || '';

            formTitle.innerText = "Edit Article";
            submitBtn.innerText = "Update Article";
            cancelEditBtn.classList.remove('hidden');
            switchTab('editorTab', document.querySelectorAll('.tab-btn')[0]);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        cancelEditBtn.addEventListener('click', () => {
            articleForm.reset();
            quill.setContents([]);
            editingIdInput.value = "";
            formTitle.innerText = "Create New Article";
            submitBtn.innerText = "Publish Article";
            cancelEditBtn.classList.add('hidden');
        });

        window.deletePost = async function(id) {
            if (confirm("Are you sure you want to delete this article?")) {
                const { error } = await supabaseClient.from('posts').delete().eq('id', id);
                if (error) alert("Error: " + error.message);
                else loadDashboardData();
            }
        };

        articleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = editingIdInput.value;
            const postData = {
                title: document.getElementById('title').value,
                slug: document.getElementById('slug').value || document.getElementById('title').value.toLowerCase().replace(/ /g, '-').replace(/[^\w-]+/g, ''),
                category: document.getElementById('category').value,
                status: document.getElementById('status').value,
                image_url: document.getElementById('image_url').value,
                excerpt: document.getElementById('excerpt').value,
                content: quill.root.innerHTML, // Rich HTML content from Quill
                meta_title: document.getElementById('meta_title').value,
                meta_description: document.getElementById('meta_description').value,
                updated_at: new Date()
            };

            submitBtn.disabled = true;
            submitBtn.innerText = 'Saving...';

            let error;
            if (id) {
                const res = await supabaseClient.from('posts').update(postData).eq('id', id);
                error = res.error;
            } else {
                const res = await supabaseClient.from('posts').insert([postData]);
                error = res.error;
            }

            if (error) {
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Failed: ' + error.message;
            } else {
                statusMessage.style.color = 'green';
                statusMessage.innerText = 'Successfully saved!';
                articleForm.reset();
                quill.setContents([]);
                editingIdInput.value = "";
                formTitle.innerText = "Create New Article";
                submitBtn.innerText = "Publish Article";
                cancelEditBtn.classList.add('hidden');
                loadDashboardData();
            }
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
