<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Admin Panel - Wellness Path</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-container, .admin-form {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary);
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
        }
        #statusMessage, #authMessage {
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }
        .hidden {
            display: none;
        }
        .logout-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #f3f4f6;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-logout:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Wellness<span>Path</span> (Admin)</a>
            <nav>
                <a href="index.html">View Site</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Admin Control Panel</h1>
            <p>Secure login required to publish and manage articles.</p>
        </section>

        <!-- 1. LOGIN SECTION -->
        <div id="authSection" class="auth-container">
            <h2>Admin Login</h2>
            <form id="loginForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your admin email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Login</button>
                <p id="authMessage"></p>
            </form>
        </div>

        <!-- 2. ARTICLE PUBLISH SECTION (Hidden until login) -->
        <div id="adminSection" class="admin-form hidden">
            <div class="logout-bar">
                <span>Logged in securely as Admin</span>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>

            <form id="articleForm">
                <div class="form-group">
                    <label for="title">Article Title</label>
                    <input type="text" id="title" required placeholder="e.g., Best Morning Stretches for Flexibility">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="fitness">Fitness & Workouts</option>
                        <option value="nutrition">Nutrition & Diet</option>
                        <option value="recovery">Recovery & Sleep</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="excerpt">Short Description / Excerpt</label>
                    <textarea id="excerpt" rows="4" required placeholder="Write a brief summary of the article..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Publish Article</button>
                <p id="statusMessage"></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Wellness Path. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://cgpwkxvpterwjjmvycmd.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_dCPcgQ-1rxIjkwGI7BJJxg_GwUYMSMJ';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authSection = document.getElementById('authSection');
        const adminSection = document.getElementById('adminSection');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const authMessage = document.getElementById('authMessage');
        const logoutBtn = document.getElementById('logoutBtn');

        const articleForm = document.getElementById('articleForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        // Check if user is already logged in
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                authSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
            } else {
                authSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        }

        checkUser();

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = 'Logging in...';
            authMessage.style.color = '#4b5563';
            authMessage.innerText = 'Verifying...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                authMessage.style.color = 'red';
                authMessage.innerText = 'Login Failed: ' + error.message;
                loginBtn.disabled = false;
                loginBtn.innerText = 'Login';
            } else {
                authSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loginForm.reset();
                loginBtn.disabled = false;
                loginBtn.innerText = 'Login';
                authMessage.innerText = '';
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            adminSection.classList.add('hidden');
            authSection.classList.remove('hidden');
        });

        // Article Publish Handler
        articleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const excerpt = document.getElementById('excerpt').value;

            submitBtn.disabled = true;
            submitBtn.innerText = 'Publishing...';
            statusMessage.style.color = '#4b5563';
            statusMessage.innerText = 'Uploading to database...';

            try {
                const { error } = await supabaseClient
                    .from('posts')
                    .insert([{ title, category, excerpt }]);

                if (error) throw error;

                statusMessage.style.color = 'green';
                statusMessage.innerText = 'Article published successfully!';
                articleForm.reset();
            } catch (err) {
                console.error('Error publishing:', err);
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Failed to publish: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Publish Article';
            }
        });
    </script>
</body>
</html>
