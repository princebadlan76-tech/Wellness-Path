<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Articles - Wellness Path Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-container, .admin-box {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 700px;
            margin: 0 auto 2rem auto;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary);
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
        }
        #statusMessage, #authMessage {
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }
        .hidden {
            display: none;
        }
        .logout-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: #f3f4f6;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-logout:hover {
            background: #dc2626;
        }
        /* Article management list style */
        .article-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .article-list-item:last-child {
            border-bottom: none;
        }
        .article-info h4 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
            color: var(--text);
        }
        .article-info span {
            font-size: 0.85rem;
            color: #6b7280;
            background: #f3f4f6;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        .action-btns {
            display: flex;
            gap: 0.5rem;
        }
        .btn-edit {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-edit:hover { background: #d97706; }
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-delete:hover { background: #dc2626; }
        .cancel-edit {
            background: #6b7280;
            margin-top: 0.5rem;
        }
        .cancel-edit:hover { background: #4b5563; }
    </style>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Wellness<span>Path</span> (Admin)</a>
            <nav>
                <a href="index.html" target="_blank">View Site</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero" style="padding: 2rem 0;">
            <h1>Admin Dashboard</h1>
            <p>Publish, edit, or delete your website articles securely.</p>
        </section>

        <!-- 1. LOGIN SECTION -->
        <div id="authSection" class="auth-container">
            <h2>Admin Login</h2>
            <form id="loginForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your admin email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Login</button>
                <p id="authMessage"></p>
            </form>
        </div>

        <!-- 2. DASHBOARD SECTION (Hidden until login) -->
        <div id="adminSection" class="hidden">
            
            <!-- Publish / Edit Form Box -->
            <div class="admin-box">
                <div class="logout-bar">
                    <span id="adminUserEmail">Logged in securely</span>
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </div>

                <h3 id="formTitle" style="margin-bottom: 1rem;">Publish New Article</h3>
                <form id="articleForm">
                    <input type="hidden" id="editingId">
                    <div class="form-group">
                        <label for="title">Article Title</label>
                        <input type="text" id="title" required placeholder="e.g., Best Morning Stretches for Flexibility">
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="fitness">Fitness & Workouts</option>
                            <option value="nutrition">Nutrition & Diet</option>
                            <option value="recovery">Recovery & Sleep</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="excerpt">Short Description / Excerpt</label>
                        <textarea id="excerpt" rows="4" required placeholder="Write a brief summary of the article..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Publish Article</button>
                    <button type="button" id="cancelEditBtn" class="btn-submit cancel-edit hidden" style="margin-top: 0.5rem;">Cancel Edit</button>
                    <p id="statusMessage"></p>
                </form>
            </div>

            <!-- Manage Existing Articles Box -->
            <div class="admin-box">
                <h3>Manage Existing Articles</h3>
                <div id="manageArticlesList" style="margin-top: 1rem;">
                    <p style="text-align: center; color: #6b7280;">Loading articles...</p>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Wellness Path. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://cgpwkxvpterwjjmvycmd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNncHdreHZwdGVyd2pqbXZ5Y21kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDY5NjUsImV4cCI6MjEwNzIyMjk2NX0.oDA47jyZfpzvY3IpFAmKyyiSEkkL5m7fUDb4ouPCorc';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authSection = document.getElementById('authSection');
        const adminSection = document.getElementById('adminSection');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const authMessage = document.getElementById('authMessage');
        const logoutBtn = document.getElementById('logoutBtn');

        const articleForm = document.getElementById('articleForm');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const statusMessage = document.getElementById('statusMessage');
        const formTitle = document.getElementById('formTitle');
        const editingIdInput = document.getElementById('editingId');
        const manageArticlesList = document.getElementById('manageArticlesList');

        // Check if user is already logged in
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                authSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadManageArticles();
            } else {
                authSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        }

        checkUser();

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = 'Logging in...';
            authMessage.style.color = '#4b5563';
            authMessage.innerText = 'Verifying...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                authMessage.style.color = 'red';
                authMessage.innerText = 'Login Failed: ' + error.message;
                loginBtn.disabled = false;
                loginBtn.innerText = 'Login';
            } else {
                authSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loginForm.reset();
                loginBtn.disabled = false;
                loginBtn.innerText = 'Login';
                authMessage.innerText = '';
                loadManageArticles();
            }
        });

        // Logout Handler
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            adminSection.classList.add('hidden');
            authSection.classList.remove('hidden');
        });

        // Load articles for management list inside admin panel
        async function loadManageArticles() {
            const { data, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                manageArticlesList.innerHTML = `<p style="color: red;">Error loading articles.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                manageArticlesList.innerHTML = `<p style="text-align: center; color: #6b7280;">No articles found.</p>`;
                return;
            }

            manageArticlesList.innerHTML = "";
            data.forEach(post => {
                const item = document.createElement('div');
                item.className = 'article-list-item';
                item.innerHTML = `
                    <div class="article-info">
                        <h4>${post.title}</h4>
                        <span>${post.category || 'General'}</span>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editArticle('${post.id}', '${escapeHtml(post.title)}', '${post.category}', '${escapeHtml(post.excerpt)}')">Edit</button>
                        <button class="btn-delete" onclick="deleteArticle('${post.id}')">Delete</button>
                    </div>
                `;
                manageArticlesList.appendChild(item);
            });
        }

        // Helper to escape quotes in title/excerpt for inline JS function calls
        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Populate form for editing an article
        window.editArticle = function(id, title, category, excerpt) {
            editingIdInput.value = id;
            document.getElementById('title').value = title;
            document.getElementById('category').value = category.toLowerCase();
            document.getElementById('excerpt').value = excerpt;

            formTitle.innerText = "Edit Article";
            submitBtn.innerText = "Update Article";
            cancelEditBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Cancel Edit Mode
        cancelEditBtn.addEventListener('click', () => {
            articleForm.reset();
            editingIdInput.value = "";
            formTitle.innerText = "Publish New Article";
            submitBtn.innerText = "Publish Article";
            cancelEditBtn.classList.add('hidden');
        });

        // Delete Article Function
        window.deleteArticle = async function(id) {
            if (confirm("Are you sure you want to delete this article?")) {
                const { error } = await supabaseClient
                    .from('posts')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Failed to delete: " + error.message);
                } else {
                    loadManageArticles();
                }
            }
        };

        // Article Create / Update Form Handler
        articleForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = editingIdInput.value;
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const excerpt = document.getElementById('excerpt').value;

            submitBtn.disabled = true;
            submitBtn.innerText = id ? 'Updating...' : 'Publishing...';
            statusMessage.style.color = '#4b5563';
            statusMessage.innerText = 'Saving to database...';

            try {
                if (id) {
                    // Update existing article
                    const { error } = await supabaseClient
                        .from('posts')
                        .update({ title, category, excerpt })
                        .eq('id', id);

                    if (error) throw error;
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = 'Article updated successfully!';
                } else {
                    // Insert new article
                    const { error } = await supabaseClient
                        .from('posts')
                        .insert([{ title, category, excerpt }]);

                    if (error) throw error;
                    statusMessage.style.color = 'green';
                    statusMessage.innerText = 'Article published successfully!';
                }

                articleForm.reset();
                editingIdInput.value = "";
                formTitle.innerText = "Publish New Article";
                submitBtn.innerText = "Publish Article";
                cancelEditBtn.classList.add('hidden');
                loadManageArticles();
            } catch (err) {
                console.error('Error saving:', err);
                statusMessage.style.color = 'red';
                statusMessage.innerText = 'Failed: ' + err.message;
            } finally {
                submitBtn.disabled = false;
                if (!editingIdInput.value) submitBtn.innerText = 'Publish Article';
            }
        });
    </script>
</body>
</html>
